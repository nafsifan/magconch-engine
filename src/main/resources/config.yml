---
# ========================================================
# Magconch Engine 核心配置文件
# ========================================================

# 系统语言设置 (对应 languages/ 目录下的文件名，例如 zh_CN, en_US)
language: "zh_CN"

# 调试模式 (输出详细的模块加载与诊断日志)
debug: false

# 核心模块预留配置区域
modules:
  # 方块撤回模块
  block-undo:
    enabled: true
    # 允许撤回的最大时间窗口 (秒)
    timeout: 2
    # 是否需要权限校验 (magconch.use.undo)
    check-permission: true

  # 生存飞行模块
  flight:
    enabled: true
    # 饱食度消耗设置
    hunger:
      # 最低允许飞行的饱食度（低于此值无法起飞，空中直接关飞坠落）
      min-food-level: 6
      # 飞行持续消耗间隔（秒）
      interval-seconds: 20
      # 每次消耗点数（1 点 = 半个鸡腿，优先扣饱和度）
      cost-per-interval: 1

  # 传送经验消耗模块
  teleport-cost:
    enabled: true
    # 基础起步消耗 (经验点数)
    base-cost: 5
    # 距离倍率 (越大越贵，默认 0.8：百格13点 / 千格30点 / 万格85点)
    distance-rate: 0.8
    # 单次消耗上限 (经验点数)
    max-cost: 150
    # 随机传送 (/rtp) 固定消耗 (经验点数)
    rtp-cost: 40
    # 跨维度额外加收 (经验点数)
    cross-world:
      nether: 15
      the-end: 25

  # 虚拟垃圾桶模块
  trash:
    enabled: true

  # 物品展示模块
  show-item:
    enabled: true
    # 展示指令冷却时间（秒，0 为无冷却）
    cooldown: 3

  # 生物捕捉系统（捕捉药水与封存生物蛋）
  creature-bundle:
    enabled: true
    # 捕捉成功基础概率 (0.0 - 1.0，1.0 为 100% 必定成功)
    capture-chance: 1.0
    # 工作台合成配方设置
    recipe:
      # 是否启用合成配方
      enabled: true
      # 工作台九宫格摆放形状 (1-3 行，每行最多 3 个字符，空格为空位)
      shape:
        - " T "
        - "EPE"
        - " G "
      # 原材料字符映射 (普通材料填原版材质名，药水可单行加冒号指定效果如 LINGERING_POTION:WEAKNESS)
      ingredients:
        T: TOTEM_OF_UNDYING
        E: ENDER_PEARL
        G: EGG
        P: LINGERING_POTION:WEAKNESS
    # 允许捕捉的生物类型白名单（填入 EntityType 枚举名，可自由增减）
    allowed-entities:
      # --- 常见家畜与农场生物 ---
      - COW
      - SHEEP
      - PIG
      - CHICKEN
      - RABBIT
      - BEE
      - TURTLE
      - FROG
      - AXOLOTL
      - SQUID
      - GLOW_SQUID
      - MOOSHROOM
      - GOAT
      - SNOW_GOLEM
      # --- 坐骑与运输生物 ---
      - HORSE
      - DONKEY
      - MULE
      - LLAMA
      - TRADER_LLAMA
      - CAMEL
      - STRIDER
      # --- 驯服与功能伴侣 ---
      - WOLF
      - CAT
      - PARROT
      - OCELOT
      - FOX
      - ALLAY
      - SNIFFER
      - ARMADILLO
      # --- 村民体系 ---
      - VILLAGER
      - ZOMBIE_VILLAGER
      # --- 生电工程与机械敌对生物 ---
      - SHULKER
      - ZOMBIE
      - HUSK
      - DROWNED
      - SKELETON
      - STRAY
      - SLIME
      - MAGMA_CUBE
      - HOGLIN
      - ZOGLIN

  # 经验存储系统（潜行右键附魔台灌装与直接吸收）
  exp-store:
    enabled: true
    # 每瓶封存的固定经验点数（默认 100 点，约合 0~7 级，64 瓶即 6400 点/约 53 级）
    points-per-bottle: 100
    # 是否播放灌装与吸收音效
    sound-enabled: true
    # 是否生成附魔台粒子动画
    particle-enabled: true
    # 是否在吸收时优先自动修补身上与另一只手持有的破损经验修补装备（1经验点数=2耐久）
    mending-repair: true

  # 高密压缩物品模块 (9合1平滑压缩与1拆9随身解压)
  compressed-item:
    enabled: true
    # 禁用材质黑名单 (默认空，可填入特定材质如 TNT 禁止压缩)
    blacklist: []
