# ========================================================
# Magconch Engine 核心配置文件
# ========================================================

# 系统语言设置 (对应 languages/ 目录下的文件名，例如 zh_CN, en_US)
language: "zh_CN"

# 调试模式 (输出详细的模块加载与诊断日志)
debug: false

# 核心模块预留配置区域
modules:
  # 方块撤回模块
  block-undo:
    enabled: true
    # 允许撤回的最大时间窗口 (秒)
    timeout: 2
    # 是否需要权限校验 (magconch.use.undo)
    check-permission: true

  # 生存飞行模块
  flight:
    enabled: true
    # 饱食度消耗设置
    hunger:
      # 最低允许飞行的饱食度（低于此值无法起飞，空中直接关飞坠落）
      min-food-level: 6
      # 飞行持续消耗间隔（秒）
      interval-seconds: 20
      # 每次消耗点数（1 点 = 半个鸡腿，优先扣饱和度）
      cost-per-interval: 1

  # 传送经验消耗模块
  teleport-cost:
    enabled: true
    # 基础起步消耗 (经验点数)
    base-cost: 5
    # 距离倍率 (越大越贵，默认 0.8：百格13点 / 千格30点 / 万格85点)
    distance-rate: 0.8
    # 单次消耗上限 (经验点数)
    max-cost: 150
    # 随机传送 (/rtp) 固定消耗 (经验点数)
    rtp-cost: 40
    # 跨维度额外加收 (经验点数)
    cross-world:
      nether: 15
      the-end: 25

  # 虚拟垃圾桶模块
  trash:
    enabled: true

  # 物品展示模块
  show-item:
    enabled: true
    # 展示指令冷却时间（秒，0 为无冷却）
    cooldown: 3

  # 生物捕捉系统（捕捉喷溅药水与封存生灵蛋）
  creature-bundle:
    enabled: true
    # 捕捉成功基础概率 (0.0 - 1.0，1.0 为 100% 必定成功)
    capture-chance: 1.0
    # 是否启用工作台星芒合成配方 (图腾 + 喷溅药水 + 2末影珍珠 + 鸡蛋)
    enable-recipe: true
    # 自定义材质模型 ID (0 为原版默认外观)
    custom-model-data: 0
    # 额外禁止捕捉的生物类型 (可选，如需禁用村民则填入 [VILLAGER, ZOMBIE_VILLAGER])
    disabled-entities: []
