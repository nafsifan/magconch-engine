---
# ========================================================
# Magconch Engine 核心配置文件
# ========================================================

# 系统语言设置 (对应 languages/ 目录下的文件名，例如 zh_CN, en_US)
language: "zh_CN"

# 调试模式 (输出详细的模块加载与诊断日志)
debug: false

# 核心模块预留配置区域
modules:
  # 方块撤回模块
  block-undo:
    enabled: true
    # 允许撤回的最大时间窗口 (秒)
    timeout: 2
    # 是否需要权限校验 (magconch.use.undo)
    check-permission: true

  # 生存飞行模块
  flight:
    enabled: true
    # 饱食度消耗设置
    hunger:
      # 最低允许飞行的饱食度（低于此值无法起飞，空中直接关飞坠落）
      min-food-level: 6
      # 飞行持续消耗间隔（秒）
      interval-seconds: 20
      # 每次消耗点数（1 点 = 半个鸡腿，优先扣饱和度）
      cost-per-interval: 1

  # 传送经验消耗模块
  teleport-cost:
    enabled: true
    # 基础起步消耗 (经验点数)
    base-cost: 5
    # 距离倍率 (越大越贵，默认 0.8：百格13点 / 千格30点 / 万格85点)
    distance-rate: 0.8
    # 单次消耗上限 (经验点数)
    max-cost: 150
    # 随机传送 (/rtp) 固定消耗 (经验点数)
    rtp-cost: 40
    # 跨维度额外加收 (经验点数)
    cross-world:
      nether: 15
      the-end: 25

  # 虚拟垃圾桶模块
  trash:
    enabled: true

  # 物品展示模块
  show-item:
    enabled: true
    # 展示指令冷却时间（秒，0 为无冷却）
    cooldown: 3

  # 生物捕捉系统（捕捉药水与封存生物蛋）
  creature-bundle:
    enabled: true
    # 捕捉成功基础概率 (0.0 - 1.0，1.0 为 100% 必定成功)
    capture-chance: 1.0
    # 工作台合成配方设置
    recipe:
      # 是否启用合成配方
      enabled: true
      # 工作台九宫格摆放形状 (1-3 行，每行最多 3 个字符，空格为空位)
      shape:
        - " T "
        - "EPE"
        - " G "
      # 原材料字符映射 (普通材料填原版材质名，药水可单行加冒号指定效果如 LINGERING_POTION:WEAKNESS)
      ingredients:
        T: TOTEM_OF_UNDYING
        E: ENDER_PEARL
        G: EGG
        P: LINGERING_POTION:WEAKNESS
    # 禁止捕捉的生物类型黑名单（除玩家与盔甲架外，默认允许捕捉所有生物；填入 EntityType 枚举名，可自由增减）
    blacklisted-entities:
      - ENDER_DRAGON      # 末影龙
      - WITHER            # 凋灵
      - WARDEN            # 循声守卫 / 监守者
      - ELDER_GUARDIAN    # 远古守卫者
      - GIANT             # 巨人
      - WANDERING_TRADER  # 流浪商人

  # 经验存储系统（潜行右键附魔台灌装与直接吸收）
  exp-store:
    enabled: true
    # 每瓶封存的固定经验点数（默认 100 点，约合 0~7 级，64 瓶即 6400 点/约 53 级）
    points-per-bottle: 100
    # 是否播放灌装与吸收音效
    sound-enabled: true
    # 是否生成附魔台粒子动画
    particle-enabled: true
    # 吸收时是否优先修补装备（需有经验修补附魔）
    mending-repair: true

  # 高密压缩物品模块 (9合1平滑压缩与1拆9随身解压)
  compressed-item:
    enabled: true
    # 禁用材质黑名单 (默认空，可填入特定材质如 TNT 禁止压缩)
    blacklist: []

  # 快速收菜模块 (右键成熟农作物即收即种)
  harvester:
    enabled: true

  # 告示牌彩色与十六进制色支持模块
  signcolor:
    enabled: true

  # 聊天提及艾特系统 (支持 @玩家、@everyone 与控制台广播)
  mentions:
    enabled: true

  # 标点系统 (潜行+鼠标中键 或 /magc mark 触发目标高亮)
  mark:
    enabled: true
    # 标记高亮持续时间 (秒)
    duration: 5
    # 防连点冷却时间 (秒)
    cooldown: 1.0
    # 视线最大探测距离 (格)
    range: 64.0

  # 随身工具箱模块
  toolbox:
    enabled: true
    craft:
      enabled: true
    stonecutter:
      enabled: true

  # 54 格扩展末影箱模块
  enderchest:
    enabled: true
