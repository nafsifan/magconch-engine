# ========================================================
# Magconch Engine 核心配置文件
# ========================================================

# 系统语言设置 (对应 languages/ 目录下的文件名，例如 zh_CN, en_US)
language: "zh_CN"

# 调试模式 (输出详细的模块加载与诊断日志)
debug: false

# 核心模块预留配置区域
modules:
  # 方块撤回模块
  block-undo:
    enabled: true
    # 允许撤回的最大时间窗口 (秒)
    timeout: 2
    # 是否需要权限校验 (magconch.use.undo)
    check-permission: true
    # 黑名单材质正则或名称（排除容器、双格复合方块及特殊物品以防止刷物品）
    blacklist-materials:
      - "DRAGON_EGG"
      - ".*_DOOR$"
      - ".*_BED$"
      - "CHEST"
      - "TRAPPED_CHEST"
      - "BARREL"
      - ".*SHULKER_BOX$"
      - "POWDER_SNOW_BUCKET"
      - "FLINT_AND_STEEL"
