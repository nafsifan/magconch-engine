# ========================================================
# Magconch Engine 核心配置文件
# ========================================================

# 系统语言设置 (对应 languages/ 目录下的文件名，例如 zh_CN, en_US)
language: "zh_CN"

# 调试模式 (输出详细的模块加载与诊断日志)
debug: false

# 核心模块预留配置区域
modules:
  # 方块撤回模块
  block-undo:
    enabled: true
    # 允许撤回的最大时间窗口 (秒)
    timeout: 2
    # 是否需要权限校验 (magconch.use.undo)
    check-permission: true

  # 生存飞行模块
  flight:
    enabled: true
    # 饱食度消耗设置
    hunger:
      # 最低允许飞行的饱食度（低于此值无法起飞，空中直接关飞坠落）
      min-food-level: 6
      # 飞行持续消耗间隔（秒）
      interval-seconds: 20
      # 每次消耗点数（1 点 = 半个鸡腿，优先扣饱和度）
      cost-per-interval: 1
