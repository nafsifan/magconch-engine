---
# ========================================================
# Magconch Engine Language Pack (English - en_US)
# ========================================================

prefix: "&#4096ff&lMAGCONCH &#8c8c8c› &#d9d9d9"

general:
  no_permission: "{prefix}&#ff4d4fNo permission to execute this action."
  unknown_command: >-
    {prefix}&#ff4d4fCommand not found.
    Use &#f0f0f0/magc help &#ff4d4f for help.
  player_only: "{prefix}&#ff4d4fThis command can only be used in-game."
  console_only: "{prefix}&#ff4d4fThis command can only be used from console."

reload:
  start: "{prefix}&#d9d9d9Reloading configurations and modules..."
  success: >-
    {prefix}&#52c41aReloaded successfully
    &#8c8c8c(&#597ef7{time}ms&#8c8c8c)
  failure: "{prefix}&#ff4d4fReload failed, please check server console."

modules:
  header: >-
    &#4096ff&lMAGCONCH &#8c8c8c›
    &#f0f0f0Modules &#8c8c8c(&#597ef7{count}&#8c8c8c)
  item_format: "  &#8c8c8c› &#f0f0f0{id} &#8c8c8c· {status}"
  status_enabled: "&#52c41a● RUNNING"
  status_disabled: "&#8c8c8c○ STOPPED"
  footer: ""

help:
  header: "&#4096ff&lMAGCONCH &#8c8c8c› &#f0f0f0Commands"
  item_format: "  &#8c8c8c/&#f0f0f0{command} &#4096ff{subcommand}\
    \ &#8c8c8c— &#d9d9d9{description}"
  footer: ""

undo:
  reverted: "&#4096ff› &#d9d9d9Undid current block"
  toggle_on: "&#4096ff› &#d9d9d9Block undo enabled"
  toggle_off: "&#8c8c8c› &#8c8c8cBlock undo disabled"
  disabled_module: "{prefix}&#ff4d4fBlock undo feature is currently disabled."

flight:
  enabled: "{prefix}&#52c41aSurvival flight mode enabled."
  disabled: "{prefix}&#ff4d4fSurvival flight mode disabled."
  too_hungry: "{prefix}&#ff4d4fFood level too low to fly."
  low_hunger: "&#fadb14› &#d9d9d9Food level critically low, eat or land soon"
  exhausted: "{prefix}&#ff4d4fFood level exhausted, flight stopped!"
  disabled_module: "{prefix}&#ff4d4fFlight feature is currently disabled."

teleport-cost:
  insufficient: >-
    {prefix}&#ff4d4fInsufficient experience! Requires
    &#fadb14{cost} &#ff4d4fexp, you only have &#fadb14{current} &#ff4d4fexp.
  warmup_notice: >-
    {prefix}&#d9d9d9Estimated teleport cost:
    &#fadb14{cost} &#d9d9d9exp &#8c8c8c(move to cancel)
  deducted: >-
    {prefix}&#52c41aConsumed &#fadb14{cost}
    &#52c41aexp to complete teleportation.

trash:
  title: "&#fa541c&lTrash Can &#8c8c8c(Close to discard)"
  opened: >-
    {prefix}&#d9d9d9Trash can opened.
    Items will be discarded upon closing.
  disabled_module: "{prefix}&#ff4d4fTrash feature is currently disabled."

show-item:
  broadcast: >-
    {prefix}&#f0f0f0{player} &#d9d9d9is
    showing {item} &#8c8c8cx{amount}
  empty_hand: "{prefix}&#ff4d4fYou are not holding any item."
  disabled_module: "{prefix}&#ff4d4fShow item feature is currently disabled."
  cooldown: >-
    {prefix}&#ff4d4fPlease wait &#fadb14{seconds}s
    &#ff4d4fbefore showing an item again.

commands:
  help:
    description: "View available commands"
  reload:
    description: "Reload plugin"
  modules:
    description: "View module status"
  undo:
    description: "Toggle block undo"
  fly:
    description: "Toggle survival flight mode"
  trash:
    description: "Open disposal trash can"
  showitem:
    description: "Show held item to everyone"
  bundle:
    description: "Give capture potion to player"
  mark:
    description: "Mark target in crosshair"
  craft:
    description: "Open portable crafting table"
  stonecutter:
    description: "Open portable stonecutter"

creature-bundle:
  item:
    potion_name: "&d&lCapture Potion"
    potion_lore: []
    filled_egg_name: "&b&l{entity_name}'s Spawn Egg"
    filled_egg_lore: []
  failed: >-
    {prefix}&#faad14Failed to capture &#f0f0f0{entity}&#faad14,
    the creature broke free!
  spawner_denied: >-
    {prefix}&#ff4d4fSpawn eggs cannot be used on spawners!
  dangerous_location: "{prefix}&#ff4d4fTarget location is too dangerous!"
  no_space: "{prefix}&#ff4d4fNot enough space to release creature safely!"
  corrupted_data: "{prefix}&#ff4d4fCreature egg data is corrupted!"
  command_usage: >-
    {prefix}&#ff4d4fUsage:
    &#f0f0f0/mcore bundle give <player> [amt]
  player_not_found: "{prefix}&#ff4d4fPlayer &#f0f0f0{player} &#ff4d4fnot found."
  invalid_amount: "{prefix}&#ff4d4fAmount must be positive integer (1-64)."
  given_success: >-
    {prefix}&#52c41aGiven &#f0f0f0{player}
    &#fadb14{amount} &#52c41acapture potion(s).
  received_notice: >-
    {prefix}&#52c41aYou received &#fadb14{amount}
    &#52c41acapture potion(s).

exp-store:
  item:
    name: "&e&lBottle of Experience"
  insufficient: >-
    {prefix}&#ff4d4fNot enough experience to condense
    an experience bottle.

mentions:
  hover_player: "&#d9d9d9Click to message &#f0f0f0{player}"
  hover_everyone: "&#d9d9d9Broadcast to everyone"
  cooldown: >-
    {prefix}&#ff4d4f@ too frequently, please wait
    &#fadb14{seconds}s &#ff4d4fbefore mentioning again.

compressed-item:
  lore_format: "{color}◈ {level}x Compressed &r&#8c8c8c({capacity})"

toolbox:
  craft_title: "&8Crafting Table"
  stonecutter_title: "&8Stonecutter"
  disabled: >-
    {prefix}&#ff4d4fThis tool is disabled by administrators.
