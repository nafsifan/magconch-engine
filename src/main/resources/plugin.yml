# yaml-language-server: $schema=https://json.schemastore.org/bukkit-plugin.json
---
name: MagconchEngine
version: '${project.version}'
main: com.magconch.engine.MagconchEngine
api-version: '1.21'
authors: [MagconchTeam]
description: Minecraft Server Modular Engine Core Plugin
softdepend: [HuskHomes]

commands:
  magconch:
    description: Magconch Engine 核心管理命令
    aliases: [magc]
    permission: magconch.command.use
    usage: /<command> [subcommand]
  fly:
    description: 切换生存饥饿飞行模式
    permission: magconch.flight.use
    usage: /<command>
  trash:
    description: 打开垃圾桶界面销毁物品
    aliases: [ljt]
    permission: magconch.trash.use
    usage: /<command>
  craft:
    description: 打开随身工作台
    permission: magconch.toolbox.craft
    usage: /<command>
  stonecutter:
    description: 打开随身切石机
    permission: magconch.toolbox.stonecutter
    usage: /<command>
  ec:
    description: 打开扩展末影箱
    aliases: [enderchest]
    permission: magconch.enderchest.use
    usage: /<command> [player]
  showitem:
    description: 向全服展示手中物品
    aliases: [show]
    permission: magconch.showitem.use
    usage: /<command>

permissions:
  magconch.admin:
    description: 拥有核心引擎所有管理权限
    default: op
    children:
      magconch.command.use: true
      magconch.command.reload: true
      magconch.command.modules: true
      magconch.use.undo: true
      magconch.flight.use: true
      magconch.trash.use: true
      magconch.showitem.use: true
      magconch.showitem.bypass: true
      magconch.teleportcost.bypass: true
      magconch.use.bundle: true
      magconch.command.bundle: true
      magconch.bypass.bundle: true
      magconch.expstore.use: true
      magconch.harvester.use: true
      magconch.signcolor.use: true
      magconch.mentions.use: true
      magconch.mentions.everyone: true
      magconch.mentions.bypass: true
      magconch.use.mark: true
      magconch.toolbox.craft: true
      magconch.toolbox.stonecutter: true
      magconch.enderchest.use: true
      magconch.enderchest.other: true
  magconch.command.use:
    description: 允许查看基础信息与帮助
    default: true
  magconch.command.reload:
    description: 允许重载核心引擎与模块配置
    default: op
  magconch.command.modules:
    description: 允许查看模块运行状态
    default: op
  magconch.use.undo:
    description: 允许使用方块防误放撤回功能
    default: true
  magconch.flight.use:
    description: 允许切换生存饥饿飞行模式
    default: true
  magconch.trash.use:
    description: 允许使用垃圾桶销毁物品
    default: true
  magconch.showitem.use:
    description: 允许使用物品展示功能
    default: true
  magconch.showitem.bypass:
    description: 豁免物品展示冷却时间
    default: op
  magconch.teleportcost.bypass:
    description: 豁免传送距离经验扣费
    default: op
  magconch.use.bundle:
    description: 允许使用生物捕捉道具收纳与释放生物
    default: true
  magconch.command.bundle:
    description: 允许使用生物捕捉管理指令
    default: op
  magconch.bypass.bundle:
    description: 豁免生物捕捉宠物主人限制与管理特权
    default: op
  magconch.expstore.use:
    description: 允许使用附魔台灌装和使用经验瓶
    default: true
  magconch.harvester.use:
    description: 允许使用右键快速收菜与自动补种功能
    default: true
  magconch.signcolor.use:
    description: 允许在告示牌上使用彩色文字
    default: true
  magconch.mentions.use:
    description: 允许在聊天中使用 @ 提及在线玩家
    default: true
  magconch.mentions.everyone:
    description: 允许在聊天中使用 @everyone 提及全服玩家
    default: op
  magconch.mentions.bypass:
    description: 豁免聊天艾特提及的冷却时间
    default: op
  magconch.use.mark:
    description: 允许使用标点功能
    default: true
  magconch.toolbox.craft:
    description: 允许使用随身工作台指令
    default: true
  magconch.toolbox.stonecutter:
    description: 允许使用随身切石机指令
    default: true
  magconch.enderchest.use:
    description: 允许打开自身 54 格末影箱
    default: true
  magconch.enderchest.other:
    description: 允许跨空间查阅与编辑他人 54 格末影箱
    default: op
