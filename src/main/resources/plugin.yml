# yaml-language-server: $schema=https://json.schemastore.org/bukkit-plugin.json
---
name: MagconchEngine
version: '${project.version}'
main: com.magconch.engine.MagconchEngine
api-version: '1.21'
authors: [MagconchTeam]
description: Minecraft Server Modular Engine Core Plugin
softdepend: [HuskHomes]

commands:
  magconch:
    description: Magconch Engine 核心管理命令
    aliases: [magc]
    permission: magconch.command.use
    usage: /<command> [subcommand]
  fly:
    description: 切换生存饥饿飞行模式
    permission: magconch.flight.use
    usage: /<command>
  trash:
    description: 打开垃圾桶界面销毁物品
    aliases: [ljt]
    permission: magconch.trash.use
    usage: /<command>
  showitem:
    description: 向全服展示手中物品
    aliases: [show]
    permission: magconch.showitem.use
    usage: /<command>

permissions:
  magconch.admin:
    description: 拥有核心引擎所有管理权限
    default: op
    children:
      magconch.command.use: true
      magconch.command.reload: true
      magconch.command.modules: true
      magconch.use.undo: true
      magconch.flight.use: true
      magconch.trash.use: true
      magconch.showitem.use: true
      magconch.showitem.bypass: true
      magconch.teleportcost.bypass: true
      magconch.use.bundle: true
      magconch.command.bundle: true
      magconch.bypass.bundle: true
      magconch.expstore.use: true
      magconch.harvester.use: true
  magconch.command.use:
    description: 允许查看基础信息与帮助
    default: true
  magconch.command.reload:
    description: 允许重载核心引擎与模块配置
    default: op
  magconch.command.modules:
    description: 允许查看模块运行状态
    default: op
  magconch.use.undo:
    description: 允许使用方块防误放撤回功能
    default: true
  magconch.flight.use:
    description: 允许切换生存饥饿飞行模式
    default: true
  magconch.trash.use:
    description: 允许使用垃圾桶销毁物品
    default: true
  magconch.showitem.use:
    description: 允许使用物品展示功能
    default: true
  magconch.showitem.bypass:
    description: 豁免物品展示冷却时间
    default: op
  magconch.teleportcost.bypass:
    description: 豁免传送距离经验扣费
    default: op
  magconch.use.bundle:
    description: 允许使用生物捕捉道具收纳与释放生物
    default: true
  magconch.command.bundle:
    description: 允许使用生物捕捉管理指令
    default: op
  magconch.bypass.bundle:
    description: 豁免生物捕捉宠物主人限制与管理特权
    default: op
  magconch.expstore.use:
    description: 允许使用附魔台灌装和使用经验瓶
    default: true
  magconch.harvester.use:
    description: 允许使用右键快速收菜与自动补种功能
    default: true
